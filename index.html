<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Javiden Safaris</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Javiden Safaris offers African safari packages, Kenya holiday packages and customized trips, from affordable getaways to luxury travel. Book on WhatsApp.">
<meta property="og:title" content="Javiden Safaris | Tours and travel in Kenya">
<meta property="og:description" content="Customized African safaris and holiday packages. Affordable and luxury travel experiences. Book through WhatsApp.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23082d66'/%3E%3Ccircle cx='44' cy='20' r='9' fill='%23ff7900'/%3E%3Cpath d='M8 48 L24 27 L35 40 L44 31 L58 48Z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: editorial travel-agency site. Full-bleed landscape hero, wide cards on a beige field, gold used only for small marks and prices. */
:root{
  --forest:#082d66; --forest-2:#164987; --beige:#edf2fa; --gold:#ff7900;
  --bg:#ffffff; --surface:#f3f6fb; --surface-2:#ffffff; --fg:#102b52; --muted:#5e6e83; --line:#d7e0ed;
  --gold-text:#d95f00; --btn-bg:#082d66; --btn-fg:#ffffff; --btn-alt-bg:#edf2fa; --btn-alt-fg:#082d66;
  --header-bg:rgba(255,253,248,.94); --foot-bg:#061f49; --foot-fg:#edf2fa; --danger:#a1311f; --ok:#1f6b3f;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 10px 30px rgba(20,40,29,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071a36; --surface:#10294d; --surface-2:#17365f; --fg:#f4f7fc; --muted:#b7c5d8; --line:#29466f;
  --gold-text:#ff9a35; --btn-bg:#ff7900; --btn-fg:#08234f; --btn-alt-bg:#203f6b; --btn-alt-fg:#f4f7fc;
  --header-bg:rgba(15,25,19,.94); --foot-bg:#0a120d; --foot-fg:#e7edf7; --danger:#f08a76; --ok:#7fd49e; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071a36; --surface:#10294d; --surface-2:#17365f; --fg:#f4f7fc; --muted:#b7c5d8; --line:#29466f;
  --gold-text:#ff9a35; --btn-bg:#ff7900; --btn-fg:#08234f; --btn-alt-bg:#203f6b; --btn-alt-fg:#f4f7fc;
  --header-bg:rgba(15,25,19,.94); --foot-bg:#0a120d; --foot-fg:#e7edf7; --danger:#f08a76; --ok:#7fd49e; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--header-bg)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6.4vw,4.4rem);font-weight:800}
h2{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:700}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
a{color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:clamp(48px,8vw,96px)}
.band.alt{background:var(--surface)}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-text)}
.lede{color:var(--muted);font-size:1.08rem;max-width:62ch}
.head{display:grid;gap:12px;margin-bottom:clamp(24px,4vw,44px)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--header-bg);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:box-shadow .3s,border-color .3s}
.site-header.scrolled{border-color:var(--line);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.bar{display:flex;align-items:center;gap:16px;min-height:100px}
.logo{display:flex;flex-direction:column;text-decoration:none;line-height:1;gap:4px;flex:none}
.logo b{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:.12em;color:var(--fg)}
.logo span{font-size:.62rem;letter-spacing:.42em;font-weight:700;color:var(--gold-text)}
.logo img{display:block;width:clamp(145px,18vw,205px);height:auto;max-height:88px;object-fit:contain}
.nav{display:none;gap:2px;margin-left:auto;align-items:center}
.nav a{padding:9px 11px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.92rem;color:var(--fg);position:relative}
.nav a:hover{background:var(--surface)}
.nav a[aria-current="page"]{color:var(--gold-text)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:3px;height:2px;background:var(--gold)}
.actions{display:none;gap:8px;margin-left:8px}
.burger{margin-left:auto;width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.burger span{display:block;width:20px;height:2px;background:currentColor;position:relative;transition:background .2s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:20px;height:2px;background:currentColor;transition:transform .3s}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg)}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease;background:var(--bg)}
.drawer>div{overflow:hidden}
.drawer.open{grid-template-rows:1fr;border-top:1px solid var(--line)}
.drawer nav{display:grid;gap:2px;padding-block:12px}
.drawer a{padding:13px 10px;border-radius:10px;text-decoration:none;font-weight:600}
.drawer a[aria-current="page"]{background:var(--surface);color:var(--gold-text)}
.drawer .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:6px 16px}
@media(max-width:520px){.bar{min-height:82px}.logo img{width:145px;max-height:76px}}
@media(min-width:1120px){.nav,.actions{display:flex}.burger,.drawer{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:2px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);font:700 .92rem/1.1 var(--body);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .18s ease,box-shadow .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:none}
.btn.alt{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#08234f}
.btn.light{background:transparent;border-color:rgba(255,255,255,.85);color:#fff}
.btn.sm{padding:9px 15px;font-size:.78rem}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn svg{width:18px;height:18px;flex:none}

/* hero */
.hero{position:relative;color:#fff;isolation:isolate;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;animation:slowzoom 24s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(10,26,17,.86) 0%,rgba(10,26,17,.55) 55%,rgba(10,26,17,.25) 100%)}
.hero .wrap{padding-block:clamp(72px,13vw,150px)}
.hero h1{max-width:14ch}
.hero p.lede{color:#edf2fa;margin-top:20px;font-size:1.15rem}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .eyebrow{color:var(--gold)}
.page-hero{background:var(--forest);color:#fff;padding-block:clamp(40px,7vw,72px)}
.page-hero .eyebrow{color:var(--gold)}
.page-hero p{color:#e0e9f5;max-width:60ch;margin-top:12px}
@keyframes slowzoom{from{transform:scale(1)}to{transform:scale(1.08)}}

/* grids and cards */
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .3s ease,box-shadow .3s ease}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.imgwrap{position:relative;overflow:hidden;aspect-ratio:3/2;background:var(--surface)}
.imgwrap img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.card:hover .imgwrap img,.tile:hover img{transform:scale(1.07)}
.card .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card .body p{color:var(--muted);font-size:.95rem}
.card .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;font-weight:600;color:var(--muted)}
.price{font-family:var(--display);font-weight:700;color:var(--gold-text);font-size:1.05rem}
.tag{position:absolute;top:12px;left:12px;background:rgba(20,32,15,.82);color:#fff0df;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.dest-card .imgwrap{aspect-ratio:4/5}
.dest-card .imgwrap::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,20,13,.85),rgba(8,20,13,0) 60%)}
.dest-card .over{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px;color:#fff;display:grid;gap:8px}
.dest-card .over p{color:#edf2fa;font-size:.92rem}
.dest-card{border:0}
.feature{padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);display:grid;gap:8px;align-content:start}
.feature .ico{width:42px;height:42px;border-radius:12px;background:var(--btn-alt-bg);color:var(--btn-alt-fg);display:grid;place-items:center}
.feature .ico svg{width:22px;height:22px}
.feature p{color:var(--muted);font-size:.95rem}
.split{display:grid;gap:clamp(24px,5vw,56px);grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:center}
.split .imgwrap{border-radius:20px;aspect-ratio:4/3}
.notice{background:var(--btn-alt-bg);color:var(--btn-alt-fg);border-radius:12px;padding:12px 16px;font-size:.9rem}
.cta-band{background:var(--forest);color:#fff;text-align:left}
.cta-band .wrap{display:grid;gap:20px;justify-items:start}
.cta-band p{color:#e0e9f5}
.cta-band .row{display:flex;flex-wrap:wrap;gap:12px}

/* reviews */
.stars{display:inline-flex;gap:2px;color:var(--gold)}
.stars svg{width:18px;height:18px}
.stars .off{color:var(--line)}
.review{padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);display:grid;gap:10px;align-content:start}
.review .who{display:flex;gap:12px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font-weight:700}
.empty{border:2px dashed var(--line);border-radius:18px;padding:34px 24px;display:grid;gap:12px;justify-items:start;background:var(--surface-2)}
.empty h3{font-size:1.4rem}

/* package detail */
.crumb{font-size:.85rem;color:#e0e9f5;margin-bottom:10px}
.crumb a{color:var(--gold)}
.pd{display:grid;gap:32px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.pd{grid-template-columns:minmax(0,1fr) 340px}}
.gal-main{border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:var(--surface)}
.gal-main img{width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:3/2;background:var(--surface)}
.thumbs button[aria-pressed="true"]{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.sec{display:grid;gap:12px;padding-top:28px}
.sec h2{font-size:1.5rem}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{padding-left:28px;position:relative}
.list li::before{content:"";position:absolute;left:4px;top:.45em;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.list.x li::before{background:var(--muted)}
.days{display:grid;gap:0;border-left:2px solid var(--gold);margin-left:8px}
.day{padding:0 0 20px 22px;position:relative}
.day::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--gold)}
.day h4{font-size:1.05rem;margin-bottom:4px}
.day p{color:var(--muted)}
.side{position:sticky;top:96px;align-self:start;border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--surface-2);display:grid;gap:14px}
@media(max-width:959px){.side{position:static}}

/* gallery */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:8px 16px;font:600 .88rem var(--body);cursor:pointer;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.masonry{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.tile{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:4/3;border:0;padding:0;cursor:zoom-in;background:var(--surface)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.tile span{position:absolute;left:10px;bottom:10px;background:rgba(10,26,17,.78);color:#fff;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,14,9,.92);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-height:78vh;max-width:min(94vw,1100px);border-radius:12px;transition:opacity .25s}
.lb p{color:#edf2fa;text-align:center;margin-top:12px}
.lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:1.4rem;cursor:pointer}
.lb .x{top:max(14px,env(safe-area-inset-top,0px));right:14px}.lb .pv{left:12px;top:50%}.lb .nx{right:12px;top:50%}

/* faq */
.faq{display:grid;gap:10px;max-width:820px}
.faq details{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);overflow:hidden}
.faq summary{padding:16px 18px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--gold-text);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.faq details[open] .ans{grid-template-rows:1fr}
.faq .ans>div{overflow:hidden}
.faq .ans p{padding:0 18px 18px;color:var(--muted)}

/* forms */
.formcard{background:var(--surface-2);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,36px);box-shadow:var(--shadow);animation:rise .7s ease both}
.fgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.f{display:grid;gap:6px;min-width:0;align-content:start}
.f.full{grid-column:1/-1}
label,.lab{font-weight:700;font-size:.9rem}
.hint{font-size:.82rem;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0;min-height:48px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:3px solid color-mix(in srgb,var(--gold) 35%,transparent);outline-offset:0}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--forest-2);flex:none}
.opt{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;background:var(--bg);cursor:pointer}
.opt:has(input:checked){border-color:var(--gold);background:var(--btn-alt-bg)}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.err{color:var(--danger);font-size:.84rem;font-weight:600;min-height:0}
[aria-invalid="true"]{border-color:var(--danger)}
.phone{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:8px}
.ages{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.steps{display:flex;gap:6px;margin-bottom:24px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--gold)}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.step{display:grid;gap:18px;animation:rise .45s ease both}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.summary{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.summary div{display:grid;grid-template-columns:minmax(100px,170px) 1fr auto;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:start}
.summary div:last-child{border-bottom:0}
.summary dt{color:var(--muted);font-weight:600;font-size:.88rem}
.summary dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.summary button{border:0;background:none;color:var(--gold-text);font:700 .8rem var(--body);cursor:pointer;text-decoration:underline}
@media(max-width:520px){.summary div{grid-template-columns:1fr auto}.summary dt{grid-column:1/-1}}
.pickinfo{padding:14px 16px;border-radius:12px;background:var(--btn-alt-bg);color:var(--btn-alt-fg);display:flex;flex-wrap:wrap;gap:6px 18px;font-weight:600;font-size:.92rem}
.result{margin-top:22px;border:2px solid var(--gold);border-radius:16px;padding:20px;display:grid;gap:12px;animation:rise .4s ease both}
.result pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:.9rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:260px;overflow:auto}
.result .row{display:flex;gap:10px;flex-wrap:wrap}
.contact-grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.bigphone{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,5vw,2.6rem);letter-spacing:.01em;user-select:all}
.policy{max-width:760px;display:grid;gap:16px}

/* footer + floating */
.site-footer{background:var(--foot-bg);color:var(--foot-fg);padding-block:56px 110px}
.site-footer .cols{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.site-footer h4{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.site-footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.site-footer a{text-decoration:none;opacity:.88}
.site-footer a:hover{opacity:1;text-decoration:underline}
.site-footer .logo b{color:#fff}
.legal{border-top:1px solid rgba(232,220,196,.2);margin-top:36px;padding-top:20px;font-size:.88rem;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}

  reviews:[
    {name:'Emily Carter', rating:5, date:'Sample · New York, USA', text:'Our safari in Kenya was absolutely unforgettable. The team was professional, friendly, and attentive to every detail. Seeing elephants and lions in their natural habitat was a dream come true.'},
    {name:'Michael Thompson', rating:5, date:'Sample · California, USA', text:'From the airport pickup to the final day, everything was well organized. Our guide was knowledgeable and made every game drive exciting. Highly recommend Javiden Safaris.'},
    {name:'Sarah Williams', rating:5, date:'Sample · Texas, USA', text:'Kenya exceeded all my expectations. The accommodation was wonderful, the scenery was breathtaking, and the hospitality was outstanding. I would book with them again in a heartbeat.'},
    {name:'James Anderson', rating:5, date:'Sample · Florida, USA', text:'A fantastic African adventure! Our guide knew exactly where to find wildlife and shared fascinating information about the animals and local culture. Every moment was worth it.'},
    {name:'Olivia Martinez', rating:5, date:'Sample · Illinois, USA', text:'The perfect balance of adventure and comfort. The team made us feel welcome from the moment we arrived. Watching the sunset over the African landscape was magical.'},
    {name:'Daniel Brooks', rating:5, date:'Sample · Colorado, USA', text:'Excellent service, beautiful destinations, and an incredible safari experience. Everything was handled smoothly, allowing us to relax and enjoy our holiday.'},
    {name:'Sophie Laurent', rating:5, date:'Sample · France', text:'A wonderful introduction to Africa. The people were welcoming, the wildlife was amazing, and our itinerary was perfectly suited to our interests.'},
    {name:'Oliver Schmidt', rating:5, date:'Sample · Germany', text:'A beautifully planned safari with excellent guides and memorable wildlife sightings. The attention to detail made the entire trip special.'},
    {name:'Charlotte Evans', rating:5, date:'Sample · United Kingdom', text:'The warmth and hospitality we experienced in Kenya were incredible. Our safari was exciting, comfortable, and full of unforgettable memories'},
    {name:"Liam O'Connor", rating:5, date:'Sample · Ireland', text:'An outstanding experience from start to finish. The guides were fantastic, the scenery was spectacular, and the trip offered excellent value'},
    {name:'Jessica Miller', rating:4, date:'Sample · New York, USA', text:'We had a wonderful safari and saw so many amazing animals. The guide was excellent and the accommodations were comfortable. A little more time at some stops would have made it perfect.'},
    {name:'Ryan Wilson', rating:4, date:'Sample · California, USA', text:'Great organization and friendly staff. The game drives were incredible, although the long travel distances between destinations were tiring. Overall, a memorable experience'},
    {name:'Amanda Davis', rating:4, date:'Sample · Texas, USA', text:'The safari was beautiful and our guide was very knowledgeable. I would have loved a little more flexibility in the daily schedule, but everything else was fantastic'},
    {name:'Christopher Moore', rating:4, date:'Sample · Florida, USA', text:'A great trip with excellent wildlife sightings and welcoming people. Some of the roads were rough, but that is part of the adventure. I would definitely recommend the experience'},
    {name:'Lauren Taylor', rating:4, date:'Sample · Illinois, USA', text:'We loved our Kenyan safari and appreciated how helpful the team was. The accommodation was lovely, and an extra rest day would have made the itinerary even better'},
    {name:'Matthew White', rating:4, date:'Sample · Colorado, USA', text:'Amazing scenery and a very professional team. We enjoyed every game drive, although the early mornings took some getting used to. A fantastic holiday overall'},
    {name:'Isabella Rossi', rating:4, date:'Sample · Italy', text:'The wildlife and landscapes were breathtaking. Our guide was kind and experienced. I would have appreciated more opportunities to learn about local communities along the way'},
    {name:'Thomas Weber', rating:4, date:'Sample · Austria', text:'A very enjoyable safari with excellent wildlife viewing. The organization was good, and the team was always helpful. A few more dining options would have improved the experience'},
    {name:'Grace Thompson', rating:4, date:'Sample · Australia', text:'Kenya was everything I hoped it would be. The safari was well planned and the people were lovely. I would have enjoyed spending more time in each location'},
    {name:'Benjamin Clarke', rating:4, date:'Sample · Canada', text:'A memorable African adventure with excellent guides and beautiful scenery. Communication before the trip could have been a little quicker, but once we arrived, everything went smoothly'}

/* generated placeholder artwork (replaced by real photos through the img field) */
const _art={};
function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function art(kind,v){
  v=v||0;const key=kind+v;if(_art[key])return _art[key];
  const r=rng(key);
  const P={
    savanna:['#f3b562','#e9805a','#fff1c7','#8a6a3a','#082d66','#08234f'],
    wildlife:['#9fc2c9','#e8d7a6','#fff4d6','#7d8f61','#164987','#08234f'],
    beach:['#8fd0df','#f5e1b4','#fffbe6','#3aa6b9','#e9d8a8','#d8c18a'],
    mountain:['#b9d4df','#e6e2d3','#ffffff','#5d7a8c','#3a5668','#1f3a2c'],
    culture:['#f0a35e','#c4554a','#ffe9b0','#6e3b2a','#4a2b1f','#2b1812'],
    hotel:['#27405a','#e6a65a','#ffe4a8','#2b4636','#1c3226','#101f17'],
    adventure:['#f2c27c','#b8705a','#ffe0a0','#5c4a5a','#3c3042','#1c1822']
  }[kind]||['#dce8f8','#edf2fa','#fff','#5476a5','#294b7c','#082d66'];
  const flip=v%2===1; if(flip){P.splice(0,2,P[1],P[0])}
  const sx=120+r()*560, sy=90+r()*80;
  let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P[0]+'"/><stop offset="1" stop-color="'+P[1]+'"/></linearGradient></defs><rect width="800" height="520" fill="url(#g)"/>';
  s+='<circle cx="'+sx+'" cy="'+sy+'" r="'+(46+r()*20)+'" fill="'+P[2]+'" opacity=".92"/>';
  const hills=(y,amp,col,op)=>{let d='M0 '+y;for(let x=0;x<=800;x+=100)d+=' Q'+(x+50)+' '+(y-amp*(.4+r()))+' '+(x+100)+' '+(y+(r()-.5)*amp*.6);return '<path d="'+d+' L800 520 L0 520Z" fill="'+col+'" opacity="'+op+'"/>'};
  if(kind==='mountain'||kind==='adventure'){
    for(let i=0;i<4;i++){const x=r()*700,w=220+r()*180,h=150+r()*130;s+='<path d="M'+x+' 380 L'+(x+w/2)+' '+(380-h)+' L'+(x+w)+' 380Z" fill="'+P[3]+'" opacity="'+(.55+i*.1)+'"/>';if(kind==='mountain')s+='<path d="M'+(x+w/2-34)+' '+(380-h+54)+' L'+(x+w/2)+' '+(380-h)+' L'+(x+w/2+34)+' '+(380-h+54)+' Q'+(x+w/2)+' '+(380-h+40)+' '+(x+w/2-34)+' '+(380-h+54)+'Z" fill="#fff" opacity=".9"/>'}
    s+='<rect y="370" width="800" height="150" fill="'+P[4]+'"/>'+hills(400,40,P[5],1);
  } else if(kind==='beach'){
    s+='<rect y="300" width="800" height="120" fill="'+P[3]+'"/>';
    for(let i=0;i<6;i++){s+='<path d="M0 '+(310+i*18)+' Q200 '+(300+i*18)+' 400 '+(310+i*18)+' T800 '+(310+i*18)+'" stroke="#fff" stroke-opacity=".35" stroke-width="2" fill="none"/>'}
    s+='<path d="M0 410 Q400 380 800 420 L800 520 L0 520Z" fill="'+P[4]+'"/>';
    const px=flip?120:640;s+='<path d="M'+px+' 470 Q'+(px+10)+' 360 '+(px+40)+' 280" stroke="#4a3320" stroke-width="10" fill="none" stroke-linecap="round"/>';
    for(let i=0;i<6;i++){const a=-150+i*60;s+='<path d="M'+(px+40)+' 280 q'+(Math.cos(a*Math.PI/180)*70)+' '+(Math.sin(a*Math.PI/180)*50-20)+' '+(Math.cos(a*Math.PI/180)*110)+' '+(Math.sin(a*Math.PI/180)*60+30)+'" stroke="#2f6b3c" stroke-width="12" fill="none" stroke-linecap="round"/>'}
  } else {
    s+=hills(330,60,P[3],.6)+hills(370,50,P[3],.9)+'<rect y="400" width="800" height="120" fill="'+P[4]+'"/>';
    if(kind==='culture'){for(let i=0;i<3;i++){const x=140+i*230+r()*40;s+='<rect x="'+x+'" y="360" width="90" height="60" fill="'+P[5]+'"/><path d="M'+(x-14)+' 362 L'+(x+45)+' 300 L'+(x+104)+' 362Z" fill="#a97a3a"/>'}}
    else if(kind==='hotel'){s+='<rect x="190" y="300" width="420" height="120" fill="'+P[5]+'"/><path d="M170 302 L400 230 L630 302Z" fill="'+P[4]+'"/>';for(let i=0;i<6;i++)s+='<rect x="'+(220+i*62)+'" y="335" width="34" height="46" rx="3" fill="'+P[2]+'"/>'}
    else{
      const tree=(x,y,k)=>'<path d="M'+x+' '+y+' q4 -40 -8 -78" stroke="'+P[5]+'" stroke-width="'+(8*k)+'" fill="none"/><ellipse cx="'+(x-8)+'" cy="'+(y-84*k)+'" rx="'+(70*k)+'" ry="'+(16*k)+'" fill="'+P[5]+'"/>';
      s+=tree(flip?600:180,430,1+r()*.3)+tree(flip?300:520,420,.7);
      if(kind==='wildlife'){const ex=flip?150:470;s+='<g fill="'+P[5]+'"><ellipse cx="'+(ex+90)+'" cy="372" rx="80" ry="46"/><circle cx="'+(ex+20)+'" cy="352" r="34"/><ellipse cx="'+(ex+34)+'" cy="366" rx="22" ry="34"/><path d="M'+(ex-6)+' 360 q-22 40 -8 78 l12 0 q-8 -34 8 -58z"/><rect x="'+(ex+40)+'" y="395" width="20" height="44"/><rect x="'+(ex+84)+'" y="395" width="20" height="44"/><rect x="'+(ex+118)+'" y="395" width="20" height="44"/></g>'}
      else{s+='<g fill="'+P[5]+'"><ellipse cx="'+(flip?300:470)+'" cy="440" rx="34" ry="12" opacity=".5"/></g>'}
    }
    if(kind==='adventure'){s+='<path d="M560 440 L620 360 L680 440Z" fill="'+P[2]+'" opacity=".95"/><path d="M620 360 L620 440" stroke="'+P[5]+'" stroke-width="3"/><circle cx="470" cy="436" r="9" fill="#f5a623"/>'}
  }
  s+='</svg>';
  return _art[key]='data:image/svg+xml;utf8,'+encodeURIComponent(s);
}

function reviewsBlock(limit){
  const R=C.reviews;
  if(!R.length)return '<div class="empty rv"><h3>Be the first to share your experience</h3><p class="lede">There are no reviews on this website yet. If you have travelled with Javiden Safaris, we would love to hear how it went.</p><a class="btn wa" target="_blank" rel="noopener" href="'+WA('Hello Javiden Safaris! I would like to share my travel experience.')+'">'+IC.wa+'Share on WhatsApp</a></div>';

  return head+'<div class="grid">'+R.slice(0,limit||99).map(r=>'<article class="review rv"><div class="who"><div class="avatar">'+esc((r.name||'?').trim()[0])+'</div><div><b>'+esc(r.name)+'</b><div class="hint">'+esc(r.date||'')+'</div></div></div>'+stars(r.rating)+'<p>'+esc(r.text)+'</p></article>').join('')+'</div>';
}

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function setErr(id,msg){const e=document.getElementById(id),m=document.getElementById(id+'-err');if(e){if(msg)e.setAttribute('aria-invalid','true');else e.removeAttribute('aria-invalid')}if(m)m.textContent=msg||''}
const emailOK=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function phoneNorm(code,raw){let p=raw.replace(/[\s\-().]/g,'');if(code&&p.startsWith('0'))p=p.slice(1);return p}
const phoneOK=(code,raw)=>{const p=phoneNorm(code,raw);return /^\+?\d{6,14}$/.test(p)};
const phoneFull=(code,raw)=>{const p=phoneNorm(code,raw);return code?code+' '+p:p};
function agesInputs(boxId,n,prefix){
  const box=document.getElementById(boxId);const old=$$('input',box).map(i=>i.value);
  box.innerHTML=Array.from({length:n},(_,i)=>'<div class="f"><label for="'+prefix+i+'">Child '+(i+1)+' age</label><input id="'+prefix+i+'" type="number" min="0" max="17" inputmode="numeric" value="'+esc(old[i]||'')+'"><span class="err" id="'+prefix+i+'-err"></span></div>').join('');
  box.hidden=n===0;
}
const getAges=(prefix,n)=>Array.from({length:n},(_,i)=>val(prefix+i));
function ageErrors(prefix,n){let bad=false;for(let i=0;i<n;i++){const v=val(prefix+i);const ok=v!==''&&+v>=0&&+v<=17&&Number.isInteger(+v);setErr(prefix+i,ok?'':'Enter an age from 0 to 17');if(!ok)bad=true}return bad}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
async function copyText(text,srcEl){
  try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){
    if(srcEl){srcEl.focus();srcEl.select&&srcEl.select();const r=document.createRange();r.selectNodeContents(srcEl);const s=getSelection();s.removeAllRanges();s.addRange(r)}
    toast('Press Ctrl+C or long-press to copy');
  }
}
function openWA(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();a.remove()}
function showResult(host,msg,intro){

function initBook(pid){

function initCustom(pid){
  let step=0;const f=$('#cz');const sd=n=>$$('.step',f)[n];
  if(pid&&pkg(pid)){const p=pkg(pid);$('#cz-base').innerHTML='<div class="notice" style="margin-bottom:18px">Customizing: <b>'+esc(p.title)+'</b></div>';$('#cz-dest').value=(dest(p.dest)||{}).name||''}
  const ints=()=>$$('input[name=cz-int]:checked').map(i=>i.value);
  const acc=()=>($$('input[name=cz-acc]:checked')[0]||{}).value||'Not sure yet';
  const basis=()=>($$('input[name=cz-basis]:checked')[0]||{}).value;
  const nch=()=>Math.min(20,Math.max(0,parseInt($('#cz-ch').value)||0));
  const cur=()=>val('cz-cur')==='Other'?(val('cz-curo').toUpperCase()||'Other'):val('cz-cur');
  function data(){
    const budget=$('#cz-nob').checked||!val('cz-bud')?'Not sure yet':cur()+' '+Number(val('cz-bud')).toLocaleString('en-US')+' '+basis();
    const ad=parseInt($('#cz-ad').value)||0,ch=nch();
    return {pkg:pid&&pkg(pid)?pkg(pid).title:null,dest:$('#cz-rec').checked?(val('cz-dest')?val('cz-dest')+' (open to recommendations)':'Please recommend a destination'):val('cz-dest'),date:val('cz-date'),flex:$('#cz-flex').checked,ad,ch,tot:ad+ch,ages:getAges('cz-age',ch),ints:ints(),acc:acc(),budget,req:val('cz-req'),name:val('cz-name'),email:val('cz-email'),phone:val('cz-phone')?phoneFull($('#cz-code').value,val('cz-phone')):''};
  }
  function sum(){
    const d=data();
    const rows=[[0,'Destination',d.dest||'-'],[1,'Departure date',(d.date||'Not chosen')+(d.flex?' (flexible)':'')],[1,'Travellers',d.tot+' ('+d.ad+' adults, '+d.ch+' children)'],[1,'Children’s ages',d.ch?d.ages.join(', '):'None'],[2,'Interests',d.ints.length?d.ints.join(', '):'None selected'],[3,'Accommodation',d.acc],[4,'Budget',d.budget],[5,'Special requests',d.req||'None']];
    $('#cz-sum').innerHTML=rows.map(r=>'<div><dt>'+r[1]+'</dt><dd>'+esc(r[2])+'</dd><button type="button" data-step="'+r[0]+'">Edit</button></div>').join('');
  }
  function show(n){
    step=n;$$('.step',f).forEach((s,i)=>s.hidden=i!==n);
    $$('#cz-steps i').forEach((b,i)=>b.classList.toggle('on',i<=n));
    $('#cz-title').textContent=STEPN[n];$('#cz-count').textContent='Step '+(n+1)+' of '+STEPN.length;
    $('#cz-back').style.visibility=n===0?'hidden':'visible';$('#cz-next').hidden=n===STEPN.length-1;$('#cz-submit').hidden=n!==STEPN.length-1;
    if(n===STEPN.length-1)sum();
    $('#cz-out').innerHTML='';f.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function valid(n){
    let first=null;const chk=(id,bad,msg)=>{setErr(id,bad?msg:'');if(bad&&!first)first=id};
    if(n===0){chk('cz-dest',!val('cz-dest')&&!$('#cz-rec').checked,'Enter a destination, or tick the box to get recommendations')}
    if(n===1){chk('cz-date',!$('#cz-flex').checked&&!val('cz-date'),'Choose a departure date, or tick flexible dates');if(val('cz-date'))chk('cz-date',val('cz-date')<today(),'Choose today or a future date');chk('cz-ad',(parseInt($('#cz-ad').value)||0)<1,'At least one adult is needed');chk('cz-ch',(parseInt($('#cz-ch').value)||0)>20,'Enter 20 children or fewer');if(ageErrors('cz-age',nch())&&!first)first='cz-age0'}
    if(n===4){chk('cz-bud',val('cz-bud')!==''&&+val('cz-bud')<=0,'Enter an amount above zero');chk('cz-curo',val('cz-cur')==='Other'&&!val('cz-curo')&&val('cz-bud')!=='','Enter the currency code')}
    if(n===6){chk('cz-name',val('cz-name').length<2,'Enter your name');chk('cz-phone',!phoneOK($('#cz-code').value,val('cz-phone')),'Enter a valid phone number, digits only');if(val('cz-email'))chk('cz-email',!emailOK(val('cz-email')),'Enter a valid email or leave it empty')}
    if(first){const t=document.getElementById(first);if(t){t.scrollIntoView({block:'center',behavior:'smooth'});t.focus()}}
    return !first;
  }
  $('#cz-next').onclick=()=>{if(valid(step))show(step+1)};
  $('#cz-back').onclick=()=>step>0&&show(step-1);
  $('#cz-ch').addEventListener('input',()=>{agesInputs('cz-ages',nch(),'cz-age');$('#cz-tot').textContent=(parseInt($('#cz-ad').value)||0)+nch()});
  $('#cz-ad').addEventListener('input',()=>{$('#cz-tot').textContent=(parseInt($('#cz-ad').value)||0)+nch()});
  $('#cz-cur').addEventListener('change',()=>{$('#cz-curo-w').hidden=$('#cz-cur').value!=='Other'});
  $('#cz-sum').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b)show(+b.dataset.step)});
  f.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&e.target.type!=='radio'){e.preventDefault();if(step<STEPN.length-1)$('#cz-next').click();else f.requestSubmit()}});
  f.addEventListener('submit',e=>{
    e.preventDefault();for(const n of [0,1,4,6])if(!valid(n)){if(n!==6){show(n);valid(n)}return}
    const d=data();
    const msg=['JAVIDEN SAFARIS — CUSTOM TRIP REQUEST','',d.pkg?'Based on package: '+d.pkg:null,'Destination: '+d.dest,'Departure Date: '+(d.date||'Not chosen')+(d.flex?' (dates are flexible)':''),'Travellers: '+d.tot+' ('+d.ad+' adults, '+d.ch+' children)','Children’s Ages: '+(d.ch?d.ages.join(', '):'None'),'Interests: '+(d.ints.length?d.ints.join(', '):'None selected'),'Accommodation: '+d.acc,'Budget: '+d.budget,'Special Requests: '+(d.req||'None'),'','Name: '+d.name,'Phone: '+d.phone,d.email?'Email: '+d.email:null,'','Please send me suggestions and a quote for this trip.'].filter(x=>x!==null).join('\n');
    window.__lastWA=WA(msg);window.__lastMsg=msg;
    openWA(showResult($('#cz-out'),msg,'Your trip request is ready to send'));
  });
  agesInputs('cz-ages',0,'cz-age');show(0);
}

/* ---------- router ---------- */
function afterRender(){
  // package gallery
  const main=$('#pgmain');if(main)$$('.thumbs button').forEach(b=>b.onclick=()=>{main.style.opacity=0;setTimeout(()=>{main.src=b.dataset.img;main.style.opacity=1},180);$$('.thumbs button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  // gallery page
  const gal=$('#gal');if(gal){
    let cat='',shown=[];
    const draw=()=>{shown=C.gallery.filter(g=>!cat||g.cat===cat);gal.innerHTML=shown.map((g,i)=>'<button type="button" class="tile rv" data-i="'+i+'"><img loading="lazy" src="'+esc(imgOf(g,g.v))+'" alt="'+esc(g.cap+' - '+g.cat)+'"><span>'+esc(g.cat)+'</span></button>').join('');reveal()};
    $('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.cat;$$('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
    gal.onclick=e=>{const t=e.target.closest('.tile');if(t)openLB(shown,+t.dataset.i)};draw();
  }
  $$('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy,$('#phoneText')));
  reveal();
}
function reveal(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches||!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pre');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});
  $$('.rv:not(.seen)').forEach(el=>{el.classList.add('seen');if(el.getBoundingClientRect().top>innerHeight*.92){el.classList.add('pre');io.observe(el)}});
}
let LB={list:[],i:0};
function openLB(list,i){LB={list,i};drawLB();$('#lb').classList.add('open');$('#lb .x').focus()}
function drawLB(){const g=LB.list[LB.i],im=$('#lbimg');im.style.opacity=0;setTimeout(()=>{im.src=imgOf(g,g.v);im.alt=g.cap+' - '+g.cat;$('#lbcap').textContent=g.cat;im.style.opacity=1},150)}
const lb=$('#lb');
lb.addEventListener('click',e=>{if(e.target.closest('.x')||e.target===lb)lb.classList.remove('open');else if(e.target.closest('.pv')){LB.i=(LB.i+LB.list.length-1)%LB.list.length;drawLB()}else if(e.target.closest('.nx')){LB.i=(LB.i+1)%LB.list.length;drawLB()}});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')$('#lb .pv').click();if(e.key==='ArrowRight')$('#lb .nx').click()});

function resolve(h){
  h=h||'home';
  if(h.startsWith('package-'))return {k:'package',arg:h.slice(8),nav:'packages'};
  if(h.startsWith('destination-'))return {k:'destination',arg:h.slice(12),nav:'destinations'};
  if(h==='book'||h.startsWith('book-'))return {k:'book',arg:h.slice(5),nav:'book'};
  if(h==='design-your-trip'||h.startsWith('design-your-trip-'))return {k:'design',arg:h.slice(17),nav:'design-your-trip'};
  if(PAGES[h])return {k:h,nav:h};
  return {k:'notfound',nav:''};
}
const TITLES={home:'Javiden Safaris | Tours and travel in Kenya',about:'About Us | Javiden Safaris',destinations:'Destinations | Javiden Safaris',packages:'African safari packages | Javiden Safaris',design:'Customize Your Trip | Javiden Safaris',book:'Book Your Adventure | Javiden Safaris',reviews:'Reviews | Javiden Safaris',gallery:'Gallery | Javiden Safaris',faq:'FAQ | Javiden Safaris',contact:'Contact Us | Javiden Safaris'};
function route(first){
  const r=resolve(location.hash.slice(1));
  const view=$('#view');
  view.innerHTML=r.k==='notfound'?notFound():PAGES[r.k](r.arg);
  $$('[data-nav]').forEach(a=>{if(a.dataset.nav===r.nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  document.title=r.k==='package'&&pkg(r.arg)?pkg(r.arg).title+' | Javiden Safaris':r.k==='destination'&&dest(r.arg)?dest(r.arg).name+' | Javiden Safaris':(TITLES[r.k]||'Javiden Safaris');
  if(r.k==='book')initBook(r.arg);
  if(r.k==='design')initCustom(r.arg);
  afterRender();
  closeMenu();
  view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');
  if(!first)window.scrollTo({top:0,behavior:'instant'});
}
function closeMenu(){$('#drawer').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');$('#burger').setAttribute('aria-label','Open menu')}
$('#burger').onclick=()=>{const o=$('#drawer').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o);$('#burger').setAttribute('aria-label',o?'Close menu':'Open menu')};
addEventListener('hashchange',()=>route(false));
addEventListener('scroll',()=>$('#hdr').classList.toggle('scrolled',scrollY>8),{passive:true});
buildShell();route(true);
</script>
